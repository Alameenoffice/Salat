name: Build Debug APK

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Assemble Mosul Prayer Times Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate debug.keystore if missing
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Align AGP, Kotlin, and SDK versions with Standard Gradle 8.10.2 Environment
        run: |
          cat > gradle/libs.versions.toml << 'EOF'
          [versions]
          agp = "8.7.3"
          coreKtx = "1.15.0"
          junit = "4.13.2"
          junitVersion = "1.2.1"
          espressoCore = "3.6.1"
          lifecycleRuntimeKtx = "2.8.7"
          lifecycleViewmodelCompose = "2.8.7"
          lifecycleRuntimeCompose = "2.8.7"
          activityCompose = "1.9.3"
          kotlin = "2.0.21"
          composeBom = "2024.09.00"
          kotlinxCoroutinesTest = "1.9.0"
          core = "1.6.1"
          runner = "1.6.2"
          kotlinxCoroutinesAndroid = "1.9.0"
          kotlinxCoroutinesCore = "1.9.0"
          okhttp = "4.12.0"
          datastorePreferences = "1.1.1"
          robolectric = "4.14.1"

          [libraries]
          androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
          junit = { group = "junit", name = "junit", version.ref = "junit" }
          androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
          androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
          androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
          androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
          androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
          androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
          androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
          androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
          androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
          androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
          androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
          androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
          androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
          kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
          androidx-core = { group = "androidx.test", name = "core", version.ref = "core" }
          androidx-runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
          androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
          androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
          androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
          kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
          kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
          okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
          androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
          robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
          kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
            alias(libs.plugins.android.application) apply false
            alias(libs.plugins.kotlin.android) apply false
            alias(libs.plugins.kotlin.compose) apply false
          }
          EOF

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "MosulPrayerTimes"
          include(":app")
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
            alias(libs.plugins.android.application)
            alias(libs.plugins.kotlin.android)
            alias(libs.plugins.kotlin.compose)
          }

          android {
            namespace = "com.example"
            compileSdk = 35

            defaultConfig {
              applicationId = "com.aistudio.mosulprayer.alhadba"
              minSdk = 24
              targetSdk = 35
              versionCode = 1
              versionName = "1.0"
              testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
            }

            signingConfigs {
              create("debugConfig") {
                storeFile = file("${rootDir}/debug.keystore")
                storePassword = "android"
                keyAlias = "androiddebugkey"
                keyPassword = "android"
              }
            }

            buildTypes {
              debug {
                signingConfig = signingConfigs.getByName("debugConfig")
              }
            }

            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_11
              targetCompatibility = JavaVersion.VERSION_11
            }
            kotlinOptions {
              jvmTarget = "11"
            }
            buildFeatures {
              compose = true
              buildConfig = true
            }
          }

          dependencies {
            implementation(platform(libs.androidx.compose.bom))
            implementation(libs.androidx.activity.compose)
            implementation(libs.androidx.compose.material.icons.core)
            implementation(libs.androidx.compose.material.icons.extended)
            implementation(libs.androidx.compose.material3)
            implementation(libs.androidx.compose.ui)
            implementation(libs.androidx.compose.ui.graphics)
            implementation(libs.androidx.compose.ui.tooling.preview)
            implementation(libs.androidx.core.ktx)
            implementation(libs.androidx.datastore.preferences)
            implementation(libs.androidx.lifecycle.runtime.compose)
            implementation(libs.androidx.lifecycle.runtime.ktx)
            implementation(libs.androidx.lifecycle.viewmodel.compose)
            implementation(libs.kotlinx.coroutines.android)
            implementation(libs.kotlinx.coroutines.core)
            implementation(libs.okhttp)
            debugImplementation(libs.androidx.compose.ui.test.manifest)
            debugImplementation(libs.androidx.compose.ui.tooling)
          }
          EOF

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK with Gradle
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mosul-prayer-times-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
