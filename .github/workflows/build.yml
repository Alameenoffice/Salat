name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fix AI Studio Invalid Versions
        run: |
          find . -type f \( -name "*.properties" -o -name "*.toml" -o -name "*.kts" \) -exec sed -i 's/9\.3\.1/8.10.2/g' {} +
          find . -type f \( -name "*.toml" -o -name "*.kts" \) -exec sed -i 's/8\.13\.[0-9]*/8.7.3/g; s/8\.12\.[0-9]*/8.7.3/g; s/8\.11\.[0-9]*/8.7.3/g; s/8\.10\.[0-9]*/8.7.3/g; s/8\.9\.[0-9]*/8.7.3/g' {} +
          find . -type f \( -name "*.toml" -o -name "*.kts" \) -exec sed -i 's/compileSdk = 36/compileSdk = 35/g; s/targetSdk = 36/targetSdk = 35/g; s/compileSdk = "36"/compileSdk = "35"/g; s/targetSdk = "36"/targetSdk = "35"/g' {} +

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mosul-prayer-times-apk
          path: app/build/outputs/apk/debug/*.apk
          
